# Cookie-consent coverage sweep.
#
# CREDENTIAL-FREE, like the email/DNS check, so it can run on every push and on
# a schedule without anyone deciding to trust it with a secret first. It loads
# public homepages and watches what they request. It never logs in, never
# clicks, never submits.
#
# This is the ONE workflow in the repo that needs Node and a browser. There is
# no way to observe what a page requests before consent without running the
# page. The exception is stated here and in scripts/consent/run-sweep.mjs
# rather than discovered by whoever next wonders why node_modules exists.
#
# NOTE FOR WHOEVER COPIES THIS ACROSS: the Claude file bridge cannot write into
# .github/, so this lands in ci/github-actions/ and a person moves it. Diff the
# two copies before telling anyone to run it; they have diverged before.

name: Fleet Consent Coverage

on:
  workflow_dispatch:
    inputs:
      concurrency:
        # RAISING THIS COSTS COVERAGE, WHICH IS THE ONE THING THE SWEEP IS FOR.
        #
        # Each unit is a headless Chrome instance, ~300MB. A GitHub
        # ubuntu-latest runner (4 vCPU / 16GB) will take 8 without trouble, so
        # memory is not the binding constraint.
        #
        # The binding constraint is that 23 of ~78 of these sites already
        # answer HTTP 403 to a headless browser. Concurrency raises the chance
        # a WAF treats the sweep as a crawl and blocks more of them, and a
        # blocked site is UNMEASURED -- it drops out of the numbers entirely.
        # Trading measured sites for a shorter run is a bad trade in a tool
        # whose whole output is coverage.
        #
        # And the run is not slow. Every site carries a fixed 9-second settle
        # for late-firing tags, so 78 sites at 4 is roughly 4 minutes. Going to
        # 8 saves about two minutes.
        #
        # Raise it only for a --only run against a handful of domains you
        # control. Leave it at 4 for a full sweep.
        #
        # A CHOICE, not a free-text box. A string input renders as an empty
        # field that invites a number somebody made up, and the whole point of
        # the comment above is that this value has a right answer for a full
        # sweep and a narrow set of defensible exceptions. Constraining it puts
        # the guidance in the picker instead of in a file nobody opens.
        description: "Parallel headless browsers. 4 for a full sweep. Higher risks more WAF blocks, and a blocked site is unmeasured, not clean."
        type: choice
        default: "4"
        options:
          - "1"
          - "2"
          - "4"
          - "8"
      only:
        description: "Comma-separated domains, to test a handful without a full sweep."
        type: string
        default: ""
      persist_ledger:
        description: "Ingest this run into history/ and push it back to main"
        type: boolean
        default: true
      run_gating:
        # THE SECOND QUESTION. The cold sweep records what fires before anyone
        # chose; this clicks Reject All and records what survives. They are
        # different sources in the ledger because they answer different
        # questions -- see the `consent-gating` block in fleet-ledger.py.
        #
        # On by default: a cold sweep with no gating pass leaves every "N
        # trackers fired on load" row without the answer to "do they stop when
        # a visitor says no", which is the question a reader actually has.
        # Turn it off for a quick coverage-only run.
        description: "Also click Reject All on every site with consent tooling, and record what still fires"
        type: boolean
        default: true
      allow_coverage_drop:
        description: "Publish even though a source measured fewer sites than last run. Only when you have read the drop and it is expected."
        type: boolean
        default: false
      publish_dashboard:
        description: "After ingesting, re-render and publish to fleet.thudstaff.com"
        type: boolean
        default: true
  # Enable once a few manual runs have been read by a person. Cron is UTC.
  # schedule:
  #   - cron: "41 9 * * 1"   # 05:41 America/New_York during EDT

permissions:
  contents: read

jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      stamp: ${{ steps.stamp.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm the roster is committed
        # The inventory IS the roster. The pilot's own sites.yaml is gone, and
        # a second site list must never come back: reconciling the pilot's
        # twelve against the inventory found two wrong, which is the whole
        # argument for one list.
        run: |
          test -f data/fleet-inventory.json \
            || { echo "::error::data/fleet-inventory.json is missing from the repo."; exit 1; }
          python3 -c "import json,re;d=json.load(open('data/fleet-inventory.json'));n=[s for s in d['sites'] if s.get('domain') and re.match(r'^[a-z0-9-]+(\.[a-z0-9-]+)+$', s['domain'], re.I)];print('roster OK: %d scannable of %d inventory entries' % (len(n), d['site_count']))"

      - name: Self-check (offline, no browser, no network)
        # Runs first. Every fixture is local, so a red here is a code problem
        # and can never be a network problem or a site being down.
        run: python3 test/test-consent.py

      - name: Install Playwright, Chromium and a virtual display
        # xvfb is a virtual screen. The scanner runs a HEADED browser, which
        # draws real windows and therefore needs a display; a runner has none.
        # `--with-deps` installs the browser's OS libraries but does not
        # reliably provide an X server, so xvfb is installed explicitly rather
        # than hoped for.
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run --help >/dev/null 2>&1 || { echo "::error::xvfb-run is not available; the sweep cannot run headed"; exit 1; }

      - name: Stamp
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"

      - name: Sweep
        # HEADED, under a virtual screen. No --headless here on purpose.
        #
        # A headless browser cannot load a site behind a bot challenge -- 27 of
        # the 28 sites this sweep could not see load headed -- and cannot see
        # Hotjar or Meta Pixel on ANY site, because both detect automation and
        # decline to fire. Headless numbers are a floor, and low is the
        # direction that reads as an all-clear. See docs/CONSENT.md, "The
        # instrument", for the measurements.
        #
        # `set -eo pipefail` is load-bearing and was missing before. Without it
        # the exit code of this pipeline is tee's, so run-sweep.mjs could fail
        # -- including the abort below -- and the step would still pass.
        #
        # THE SWEEP VERIFIES ITSELF. Asking for headed is not the same as
        # getting it: if xvfb were missing or DISPLAY unset, the browser could
        # come up headless and every number would be an undercount wearing a
        # `chromium-headed` label we wrote ourselves. run-sweep.mjs reads the
        # browser's own User-Agent on the first result and exits 3 if it
        # disagrees with what was asked for. That is why this can ship without
        # having been run on a runner first -- it fails loudly rather than
        # quietly producing wrong data.
        run: |
          set -eo pipefail
          xvfb-run -a node scripts/consent/run-sweep.mjs \
            --inventory data/fleet-inventory.json \
            --out reports \
            --stamp "${{ steps.stamp.outputs.value }}" \
            --concurrency "${{ inputs.concurrency || '4' }}" \
            ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }} \
            | tee /tmp/sweep.txt

      - name: Findings
        run: |
          {
            echo "## Consent coverage"
            echo
            echo '```'
            cat /tmp/sweep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        # Surfaced as warnings, never as a red build. A consent finding is a
        # client conversation, and a build that goes red for one teaches people
        # to ignore the build. The numbers are the point, not the exit code.
        run: |
          python3 - "reports/fleet-consent-${{ steps.stamp.outputs.value }}.json" <<'PY'
          import json, sys
          scan = json.load(open(sys.argv[1]))
          sites = scan.get("sites", [])
          ok = [s for s in sites if s.get("ok")]
          leak = [s for s in ok if s.get("preConsentTrackers")]
          notool = [s for s in ok if not s.get("bannerDetected")]
          dead = [s for s in sites if not s.get("ok")]
          if leak:
              print("::warning::%d site(s) fired trackers before any consent interaction: %s"
                    % (len(leak), ", ".join(s["domain"] for s in leak[:20])))
          if notool:
              print("::warning::%d site(s) showed no consent tooling: %s"
                    % (len(notool), ", ".join(s["domain"] for s in notool[:20])))
          if dead:
              print("::warning::%d site(s) could not be loaded, so their consent posture is unmeasured, not clean: %s"
                    % (len(dead), ", ".join(s["domain"] for s in dead[:20])))
          for s in scan.get("skipped_no_domain", []):
              print("::notice::skipped %s: %s" % (s["site_id"], s["reason"]))
          print("scanned=%d of %d  leaking=%d  no_tooling=%d  unscannable=%d"
                % (len(ok), len(sites), len(leak), len(notool), len(dead)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-consent-${{ steps.stamp.outputs.value }}
          path: reports/fleet-consent-*.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # The gating sweep. Does rejecting actually stop the tags?
  #
  # A SECOND JOB, NOT A SECOND WORKFLOW, because its roster IS the cold scan
  # this run just produced: run-gating-sweep.mjs takes --from-scan and keeps
  # the sites where a banner was actually DETECTED. A separate workflow would
  # have to guess which scan to read, and the honest options are "the newest in
  # the repo" (there is none -- reports/ is gitignored) or "re-run the cold
  # sweep first", which is this job with extra steps. Running it here is also
  # how it is run by hand.
  #
  # It writes a DIFFERENT SOURCE (`consent-gating`), so persist-ledger below
  # ingests both reports in one pass -- one directory, one ingest, one lock.
  # -------------------------------------------------------------------------
  gating:
    name: Reject All, and see what still fires
    needs: consent
    if: >-
      always()
      && inputs.run_gating
      && needs.consent.result == 'success'
    runs-on: ubuntu-latest
    # Three passes per site with real waits, and the tester is one browser per
    # site rather than one for the sweep. 27 sites took ~13 minutes by hand.
    timeout-minutes: 45
    outputs:
      stamp: ${{ steps.gstamp.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright, Chromium and a virtual display
        # Same as the cold sweep, and for the same reason: test-gating.mjs
        # launches a HEADED browser and a runner has no screen.
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run --help >/dev/null 2>&1 || { echo "::error::xvfb-run is not available; the gating sweep cannot run headed"; exit 1; }

      - name: Download the cold scan this run just produced
        # The roster comes from THIS run's scan, not from the repo. reports/ is
        # gitignored, so on a fresh checkout there is nothing to read.
        uses: actions/download-artifact@v4
        with:
          name: fleet-consent-${{ needs.consent.outputs.stamp }}
          path: reports

      - name: Stamp
        id: gstamp
        run: echo "value=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"

      - name: Gating sweep
        # HEADED, and it CHECKS that it got headed. test-gating.mjs reads the
        # browser's own User-Agent and exits 3 on a mismatch; run-gating-sweep
        # turns that into an abort for the whole sweep rather than one
        # INCONCLUSIVE row per site.
        #
        # That guard matters more here than in the cold sweep: "nothing fires
        # after rejection" is the BEST POSSIBLE RESULT of this test, so a
        # silently headless run -- which sees fewer tags, and cannot load a
        # site behind a bot challenge at all -- reads as a clean pass on every
        # site. The instrument manufacturing the best answer is exactly how the
        # v1 and v2 measured windows went wrong.
        #
        # `set -eo pipefail` for the same reason as the cold sweep: without it
        # the pipeline's exit code is tee's and the abort above would pass.
        run: |
          set -eo pipefail
          SCAN="$(ls -t reports/fleet-consent-*.json | head -1)"
          test -n "$SCAN" || { echo "::error::no cold scan to take a roster from"; exit 1; }
          echo "roster from $SCAN"
          xvfb-run -a node scripts/consent/run-gating-sweep.mjs \
            --from-scan "$SCAN" \
            --out reports \
            --stamp "${{ steps.gstamp.outputs.value }}" \
            --concurrency 3 \
            | tee /tmp/gating.txt

      - name: Findings
        # UNTESTED IS NOT A PASS, and this is where a person reads it. A site
        # with no clickable reject control and a site behind a Cloudflare
        # challenge are both INCONCLUSIVE, and neither is "nothing fires".
        run: |
          f="$(ls -t reports/fleet-consent-gating-*.json | head -1)"
          python3 - "$f" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          d = json.load(open(sys.argv[1]))
          sites = d["sites"]
          leak = [s for s in sites if (s.get("still_firing_after_reject_all") or [])]
          incon = [s for s in sites if s["verdict"].startswith("INCONCLUSIVE")]
          print("## Consent gating\n")
          print("| | |\n|---|---|")
          print("| sites with consent tooling | %d |" % len(sites))
          print("| tested | %d |" % (len(sites) - len(incon)))
          print("| still firing after Reject All | %d |" % len(leak))
          if leak:
              print("\n**Still firing, named rather than counted:**\n")
              for s in leak:
                  print("- `%s` %s" % (s["domain"],
                                       ", ".join(s["still_firing_after_reject_all"])))
          if incon:
              print("\n**Not tested, so not clean either:**\n")
              for s in incon:
                  print("- `%s` %s" % (s["domain"], s["verdict"].split(":", 1)[-1].strip()))
          print("\nA Google tag still sending a cookieless `gcs=G100` ping after a "
                "rejection is NOT counted here: that is what a correctly configured "
                "site does. See docs/CONSENT.md.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-consent-gating-${{ steps.gstamp.outputs.value }}
          path: reports/fleet-consent-gating-*.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Same persist script and the same fleet-ledger-write lock as the other
  # workflows, so none of them can race each other.
  # -------------------------------------------------------------------------
  persist-ledger:
    name: Ingest into the ledger
    # WAITS FOR GATING, BUT IS NOT GATED ON IT. The cold sweep's 79 rows are
    # worth persisting whether or not the Reject All pass succeeded, and a
    # gating failure that threw away a good cold sweep would be the worse
    # outcome. `always()` plus an explicit test on consent alone gives that:
    # gating skipped or failed simply means no consent-gating rows this run.
    needs: [consent, gating]
    if: >-
      always()
      && inputs.persist_ledger
      && needs.consent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: fleet-ledger-write
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run's reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fleet-consent-${{ needs.consent.outputs.stamp }}
          path: /tmp/ci-reports

      - name: Download this run's gating report, if there is one
        # SAME DIRECTORY, so one ingest pass handles both sources under one
        # ledger-write lock. `if` on the job result rather than
        # continue-on-error alone: a missing artifact when gating SUCCEEDED
        # would be a real problem worth failing on, and this way that case is
        # still an error while a skipped or failed gating job is simply absent.
        if: needs.gating.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fleet-consent-gating-${{ needs.gating.outputs.stamp }}
          path: /tmp/ci-reports

      - name: Ingest, render and push
        env:
          # persist-ledger.sh prints the drop either way; this only decides
          # the exit code, and therefore whether publish is allowed to run.
          FLEET_ALLOW_COVERAGE_DROP: ${{ inputs.allow_coverage_drop && '1' || '0' }}
        run: ./scripts/persist-ledger.sh /tmp/ci-reports "Consent coverage sweep"

  # -------------------------------------------------------------------------
  # Publish. Without this the ledger moves and fleet.thudstaff.com does not,
  # which is worse than not publishing at all: the page looks current.
  # Shared job, not a fourth copy of the same steps.
  # -------------------------------------------------------------------------
  publish-dashboard:
    name: Publish dashboard
    needs: persist-ledger
    if: >-
      always()
      && inputs.publish_dashboard
      && needs.persist-ledger.result == 'success'
    uses: ./.github/workflows/_publish-dashboard.yml
    secrets: inherit
    with:
      allow_coverage_drop: ${{ inputs.allow_coverage_drop }}
      label: "Consent coverage sweep"
