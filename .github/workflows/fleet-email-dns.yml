# Fleet email authentication check.
#
# This is deliberately the FIRST job to reach CI, ahead of the Pantheon scan,
# because it needs no secret of any kind. That makes it a clean infrastructure
# canary: if this job goes red, the problem is the runner, the network or the
# workflow itself. It cannot be an auth problem, because there is nothing to
# authenticate. If this is green and the Pantheon job is red, the machine token
# is the answer and nobody has to guess.
#
# Thin wrapper on purpose. Every decision this makes is a flag on a script that
# runs identically on a laptop. If you find yourself editing this file to change
# WHAT gets checked, the change belongs in the script instead.

name: Fleet Email DNS Check

on:
  workflow_dispatch:
    inputs:
      compare_to_workbook:
        description: "Also score the adopted rules against the workbook's recorded cells"
        type: boolean
        default: true
      fail_on_regression:
        description: "Fail the build if the adopted rule stops reproducing the workbook"
        type: boolean
        default: false
      persist_ledger:
        description: "Ingest this run into history/ and push it back to main"
        type: boolean
        default: true
      publish_dashboard:
        description: "After ingesting, re-render and publish to fleet.thudstaff.com"
        type: boolean
        default: true
  # Enable once a few manual runs have been reviewed. Cron is UTC and is not
  # punctual; runs queue under load. That is fine here, nothing depends on the
  # exact minute.
  # schedule:
  #   - cron: "17 11 * * 1-5"   # 07:17 America/New_York during EDT

permissions:
  contents: read

jobs:
  email-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The persist job needs the stamp to find this run's artifact by name.
    outputs:
      stamp: ${{ steps.stamp.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm the input file is committed
        # reports/ is gitignored but data/ is not. If the inventory is missing
        # the check would fail later with a less obvious error, so fail here
        # with a clear one.
        run: |
          test -f data/fleet-email-inventory.json \
            || { echo "::error::data/fleet-email-inventory.json is missing from the repo. Regenerate it with scripts/extract-audit-workbook.py and commit it."; exit 1; }
          python3 -c "import json;d=json.load(open('data/fleet-email-inventory.json'));print('inventory OK: %d sites' % d['site_count'])"

      - name: Self-check (offline, no DNS)
        # Runs before the real check on purpose. If the parsing or the recovered
        # rule has been broken by an edit, that surfaces here rather than as a
        # puzzling diff in the results. The scan-dependent assertions skip at
        # this point, because reports/ is gitignored and does not exist yet;
        # they run in the verification step after the check instead.
        run: python3 test/test-email-dns.py

      - name: Stamp
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"

      - name: Check email authentication for the whole fleet
        run: |
          python3 scripts/fleet-email-dns.py check \
            --inventory data/fleet-email-inventory.json \
            --out reports \
            --stamp "${{ steps.stamp.outputs.value }}" \
            --workers 12

      - name: Verify the scan that was just produced
        # Same suite, second run. Now that reports/ has a real file in it, the
        # assertions that were skipped above execute against genuine output:
        # 78 sites, no errored rows, both DMARC readings recorded, and the
        # adopted rule still reproducing the workbook.
        run: python3 test/test-email-dns.py

      - name: Findings digest
        run: |
          {
            echo "## Fleet email authentication"
            echo
            python3 scripts/fleet-email-dns.py report \
              --scan "reports/fleet-email-dns-${{ steps.stamp.outputs.value }}.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Score the adopted rules against the workbook
        if: ${{ inputs.compare_to_workbook }}
        id: compare
        run: |
          {
            echo "<details><summary>Rule agreement with the manual workbook</summary>"
            echo
            echo '```'
            python3 scripts/fleet-email-dns.py compare \
              --inventory data/fleet-email-inventory.json \
              --scan "reports/fleet-email-dns-${{ steps.stamp.outputs.value }}.json" \
              | tee /tmp/compare.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard against rule drift
        # The adopted rules were recovered empirically from the workbook. If a
        # code change quietly stops reproducing it, that is a regression even
        # though nothing crashed. Off by default until a few clean runs exist.
        if: ${{ inputs.compare_to_workbook && inputs.fail_on_regression }}
        run: |
          worst=$(grep -oE 'BEST: [^ ]+ at [0-9.]+%' /tmp/compare.txt \
                  | grep -oE '[0-9.]+' | sort -n | head -1)
          echo "lowest rule agreement: ${worst}%"
          awk -v w="$worst" 'BEGIN { exit (w >= 95) ? 0 : 1 }' \
            || { echo "::error::rule agreement fell below 95%"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-email-dns-${{ steps.stamp.outputs.value }}
          path: reports/fleet-email-dns-*.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Persist the run into the ledger. See the twin job in
  # pantheon-fleet-healthcheck.yml; the two share the fleet-ledger-write lock
  # and the same scripts/persist-ledger.sh, so they cannot race each other.
  # -------------------------------------------------------------------------
  persist-ledger:
    name: Ingest into the ledger
    needs: email-dns
    if: >-
      always()
      && inputs.persist_ledger
      && needs.email-dns.result != 'skipped'
      && needs.email-dns.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: fleet-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run's reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fleet-email-dns-${{ needs.email-dns.outputs.stamp }}
          path: /tmp/ci-reports

      - name: Ingest, render and push
        run: ./scripts/persist-ledger.sh /tmp/ci-reports "Fleet email DNS check"

  # -------------------------------------------------------------------------
  # Publish. Without this the ledger moves and fleet.thudstaff.com does not,
  # which is worse than not publishing at all: the page looks current.
  # Shared job, not a fourth copy of the same steps.
  # -------------------------------------------------------------------------
  publish-dashboard:
    name: Publish dashboard
    needs: persist-ledger
    if: >-
      always()
      && inputs.publish_dashboard
      && needs.persist-ledger.result == 'success'
    uses: ./.github/workflows/_publish-dashboard.yml
    secrets: inherit
    with:
      label: "Fleet email DNS check"
