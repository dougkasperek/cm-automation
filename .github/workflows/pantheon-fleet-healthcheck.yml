# ---------------------------------------------------------------------------
# Pantheon Fleet Health Check
#
# THIS FILE IS DELIBERATELY THIN. It does platform glue only:
#   install tools -> inject secrets -> run the script -> collect outputs.
# All actual logic lives in scripts/pantheon-fleet-healthcheck.sh so the exact
# same run is reproducible on a laptop and portable to Azure DevOps. If you
# find yourself adding business logic here, it belongs in the script instead.
#
# STATE, 2026-08-22: manual dispatch, run_mode=full by default, no schedule.
#
# This block used to read "PHASE 1 (now): API-only, no SSH key. PHASE 2: flip
# run_mode to full once an SSH key is registered." Both were true when written
# and neither was true afterwards -- PANTHEON_SSH_KEY has been registered and
# full has run since 2026-08-18, including here in CI. The stale note was read
# as current state on 2026-08-22 and produced the wrong answer about why a scan
# had collected less than it could. A comment describing the old world is worse
# than no comment.
#
# api-only remains available as a deliberate choice: it needs no SSH key and is
# the fallback if the key is ever revoked. It is NOT the default, because a
# default that quietly measures less is the defect this project keeps finding.
#
# STILL OPEN: the schedule block below stays commented out, and fail_on_crit
# stays off, until a scheduled run has been trusted for several cycles.
# ---------------------------------------------------------------------------
name: Pantheon Fleet Health Check

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "full (SSH + WP-CLI, the complete scan) or api-only (no SSH, platform facts only)"
        type: choice
        options: [full, api-only]
        default: full
      target_env:
        description: "Pantheon environment to inspect"
        type: choice
        options: [live, test, dev]
        default: live
      sites:
        description: "Optional comma-separated site subset (blank = whole fleet)"
        type: string
        default: ""
      fail_on_crit:
        description: "Fail the job when a CRIT finding exists"
        type: boolean
        default: false
      persist_ledger:
        description: "Ingest this run into history/ and push it back to main"
        type: boolean
        default: true
      allow_coverage_drop:
        description: "Publish even though a source measured fewer sites than last run. Only when you have read the drop and it is expected."
        type: boolean
        default: false
      publish_dashboard:
        # DEFAULT FLIPPED TO TRUE, 2026-08-19. It was false, which meant the
        # one workflow that could publish only did so when somebody remembered
        # to tick it. Together with the other three never publishing at all,
        # that is the whole reason fleet.thudstaff.com drifted behind the
        # ledger it is rendered from.
        #
        # The description was also stale: publishing has written straight to
        # R2 since 2026-08-19 and the Worker has no write route.
        #
        # Turn it off for a debugging run you do not want on the live page.
        # The ledger and the page should move together by default.
        description: "After ingesting, re-render from the ledger and publish to fleet.thudstaff.com"
        type: boolean
        default: true

  # Validate the scripts themselves on every PR that touches them. This runs
  # the mock harness only - no secrets, no network, no Pantheon.
  pull_request:
    paths:
      - "scripts/**"
      - "test/**"
      - ".github/workflows/pantheon-fleet-healthcheck.yml"

  # PHASE 3 - enable when the workflow has been trusted for a few cycles.
  # schedule:
  #   - cron: "0 11 * * 1"   # Mondays 11:00 UTC (07:00 ET / 06:00 EST)

permissions:
  contents: read

env:
  # Pin the Terminus version. An unpinned install means a Pantheon release can
  # change this job's behaviour on a morning nobody touched the repo.
  TERMINUS_VERSION: "4.3.2"

jobs:
  # -------------------------------------------------------------------------
  # Always-on, secret-free validation. Fails in ~90s if a script regressed.
  # -------------------------------------------------------------------------
  verify-scripts:
    name: Verify scripts (offline mock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh

      - name: Run mock harness
        run: ./test/run-local-test.sh

  # -------------------------------------------------------------------------
  # The real scan. Manual only in phase 1.
  # -------------------------------------------------------------------------
  fleet-healthcheck:
    name: Fleet health check
    if: github.event_name != 'pull_request'
    needs: verify-scripts
    runs-on: ubuntu-latest
    # ONE SCAN AT A TIME. On 2026-09-01 two dispatches two minutes apart ran
    # two scans against the same 49 sites. lasershows.com measured cleanly in
    # one and read ERROR in the other two minutes later, and both runs
    # measured fewer sites (45 and 46) than one run alone (47). A schedule
    # firing during a manual run produces exactly this. A second dispatch now
    # waits for the first to finish rather than sharing the API with it.
    # Its own group, not the ledger lock: the ledger lock serialises a 25-second
    # ingest and this would queue a scan behind an unrelated one. B9 in
    # docs/DO-THIS-NEXT.md; test/test-workflows.py asserts every scan job
    # carries a group of its own.
    concurrency:
      group: pantheon-terminus
      queue: max
      cancel-in-progress: false
    # Platform-level ceiling. The script has its own per-call timeouts; this is
    # the second safety net, so a pathological run cannot burn an entire hour
    # of minutes the way the pfannenbergpartners hang burned a local terminal.
    #
    # RAISED 45 -> 75 on 2026-08-25, from a measurement rather than a guess. A
    # full run reached site 50 of 52 and was cancelled 25 seconds later, having
    # taken 44 minutes to scan 50 sites: about 53 seconds each, five terminus
    # calls per site and every one of them an SSH round trip. 52 sites is
    # therefore ~46 minutes of scanning plus ~4 of setup, and 45 was under the
    # floor rather than a generous ceiling.
    #
    # 75 is not 50. The margin is for the sites that hit WP_CLI_TIMEOUT: those
    # cost their full timeout each and a handful of them is the difference
    # between finishing and being killed two sites short.
    #
    # This is a ceiling, not a target. If a run ever approaches it, the answer
    # is to find out which site got slow, not to raise this again.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          php --version | head -1
          jq --version

      - name: Install Terminus
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/terminus.phar \
            "https://github.com/pantheon-systems/terminus/releases/download/${TERMINUS_VERSION}/terminus.phar"
          chmod +x /tmp/terminus.phar
          sudo mv /tmp/terminus.phar /usr/local/bin/terminus
          terminus --version

      # ---------------------------------------------------------------------
      # SECRETS - phase 1 uses plain GitHub Actions secrets so the first run has
      # exactly one moving part. docs/SECRETS.md describes the swap to Keeper,
      # which replaces THIS STEP ONLY and leaves everything below untouched.
      # ---------------------------------------------------------------------

      # PHASE 2 ONLY. An ephemeral runner has no known_hosts, so without
      # accept-new every single site emits a host-key prompt or warning. That
      # warning on stdout is what broke jq on the first real fleet run.
      - name: Configure SSH for Pantheon
        if: inputs.run_mode == 'full'
        env:
          PANTHEON_SSH_KEY: ${{ secrets.PANTHEON_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PANTHEON_SSH_KEY}" ]; then
            echo "::error::run_mode=full requires the PANTHEON_SSH_KEY secret."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${PANTHEON_SSH_KEY}" > ~/.ssh/id_pantheon
          chmod 600 ~/.ssh/id_pantheon
          cat >> ~/.ssh/config <<'EOF'
          Host *.drush.in
            IdentityFile ~/.ssh/id_pantheon
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Run fleet health check
        id: scan
        env:
          # Passed via env, never as a CLI argument, so it cannot appear in a
          # process listing or a command echo.
          PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
          # Workflow inputs are read through env, never interpolated straight
          # into the shell body. `${{ }}` inside a run block is textual
          # substitution, so an input containing a quote or a semicolon would
          # otherwise execute as shell.
          IN_MODE: ${{ inputs.run_mode }}
          IN_ENV: ${{ inputs.target_env }}
          IN_SITES: ${{ inputs.sites }}
          IN_FAIL: ${{ inputs.fail_on_crit }}
        run: |
          set -uo pipefail
          set -- --out ./reports --env "$IN_ENV"
          [ "$IN_MODE" = "api-only" ] && set -- "$@" --api-only
          [ "$IN_FAIL" != "true" ] && set -- "$@" --no-fail-on-crit
          [ -n "$IN_SITES" ] && set -- "$@" --sites "$IN_SITES"

          echo "Running: pantheon-fleet-healthcheck.sh $*"

          # `|| RC=$?` is load-bearing, do not simplify it back to a bare call
          # followed by RC=$?. GitHub's default shell for a run: step is
          # `bash -e {0}`, and `set -uo pipefail` above does NOT clear that -e.
          # So a bare call that exits non-zero killed the step on that line:
          # RC=$?, the script_exit output and the deliberate exit 0 below were
          # all unreachable, and the re-raise step then read an EMPTY exit code
          # and reported "Scan failed with exit code ." A command followed by
          # || is exempt from -e, which is what makes the rest of this reachable.
          RC=0
          ./scripts/pantheon-fleet-healthcheck.sh "$@" || RC=$?
          echo "script_exit=$RC" >> "$GITHUB_OUTPUT"
          # The step must not die before artifacts are collected. Exit 2 (CRIT)
          # is re-raised in the final step, after everything is uploaded.
          exit 0

      # Platform glue: turn the script's own Markdown digest into the job
      # summary. The script does not know GitHub exists; this step is the only
      # thing that would need rewriting for Azure DevOps.
      - name: Publish digest to job summary
        if: always()
        run: |
          MD="$(ls -1 reports/fleet-health-*.md 2>/dev/null | tail -n1 || true)"
          if [ -n "$MD" ]; then
            cat "$MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No digest produced - the scan failed before writing output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-health-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Re-raise scan severity
        if: always()
        run: |
          RC="${{ steps.scan.outputs.script_exit }}"
          case "$RC" in
            0) echo "Scan completed clean." ;;
            2) echo "::warning::Scan found CRIT findings."
               if [ "${{ inputs.fail_on_crit }}" = "true" ]; then exit 2; fi ;;
            "") echo "::error::The scan step died before it could report an exit code. Read the 'Run fleet health check' step's log, not this message - the real error is the last line there."
                exit 1 ;;
            *) echo "::error::Scan failed with exit code $RC."; exit 1 ;;
          esac

  # -------------------------------------------------------------------------
  # Persist the run into the ledger.
  #
  # This job exists because until 2026-08-18 nothing CI produced ever reached
  # history/. reports/ is gitignored, ingest was a manual laptop step, and this
  # workflow had contents:read, so every CI scan was a 90-day artifact and then
  # gone. history/ is the one asset here that cannot be regenerated.
  #
  # It is a SEPARATE JOB on purpose. Only this job needs contents:write, and
  # only this job serialises on the ledger lock - putting THIS guard on the
  # scan would queue a 45-minute run behind a 25-second one. The scan has a
  # lock of its own since 2026-09-03 (`pantheon-terminus`, above), which
  # serialises scans against scans and nothing else.
  #
  # It runs even when the scan job FAILED. A CRIT finding fails the job by
  # design when fail_on_crit is on, and that run's observations are precisely
  # the ones worth keeping.
  # -------------------------------------------------------------------------
  persist-ledger:
    name: Ingest into the ledger
    needs: fleet-healthcheck
    if: >-
      always()
      && inputs.persist_ledger
      && needs.fleet-healthcheck.result != 'skipped'
      && needs.fleet-healthcheck.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Repo-wide lock, shared by name with the email workflow. Two workflows
    # appending to one JSONL and pushing is the one race this design has.
    concurrency:
      group: fleet-ledger-write
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # May legitimately not exist: the scan can die before writing anything,
      # and the upload step above is if-no-files-found:warn. The script treats
      # an absent or empty directory as zero runs.
      - name: Download this run's reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fleet-health-${{ github.run_number }}
          path: /tmp/ci-reports

      - name: Ingest, render and push
        env:
          FLEET_ALLOW_COVERAGE_DROP: ${{ inputs.allow_coverage_drop && '1' || '0' }}
        run: ./scripts/persist-ledger.sh /tmp/ci-reports "Pantheon health check, ${{ inputs.run_mode }}"

  # -------------------------------------------------------------------------
  # Publish the dashboard to Cloudflare.
  #
  # AFTER persist-ledger, deliberately. Publishing before it would ship a page
  # rendered from a ledger that does not yet contain the run that just
  # finished, so the live dashboard would sit one scan behind every time and
  # nothing on the page would say so.
  #
  # `needs.persist-ledger` also means this is skipped whenever persist_ledger
  # is off. That is correct: with no ingest there is nothing new to publish.
  #
  # contents:read only. This job renders and PUTs over HTTPS; it has no reason
  # to touch the repo, and persist-ledger already holds the write permission.
  #
  # Default OFF until the Worker, the R2 bucket, the hostname and the Access
  # policy exist. See docs/DASHBOARD.md.
  # -------------------------------------------------------------------------
  # PUBLISH THROUGH THE SHARED WORKFLOW, since 2026-09-03. This job was an
  # inline copy of _publish-dashboard.yml from before that file existed, and
  # the copy drifted the way copies do: the alert step ("tell someone if a new
  # critical appeared") was added to the shared workflow on 2026-09-02 and
  # never reached this one, so a Pantheon publish could not alert. Caught by
  # reading this run's job steps after a full scan and finding no such step.
  # The concurrency group, the fresh checkout of main and the credential check
  # all live in the shared file now, once.
  publish-dashboard:
    name: Publish dashboard
    needs: persist-ledger
    if: >-
      always()
      && inputs.publish_dashboard
      && needs.persist-ledger.result == 'success'
    uses: ./.github/workflows/_publish-dashboard.yml
    secrets: inherit
    with:
      allow_coverage_drop: ${{ inputs.allow_coverage_drop }}
      label: "Pantheon fleet health check"
