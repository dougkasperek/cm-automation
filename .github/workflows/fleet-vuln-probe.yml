# Wordfence Intelligence V3 feed probe.
#
# SCHEDULED DAILY SINCE 2026-09-03, after nine manual runs over four days had
# been read by a person, two sites' plugin versions had been checked against
# wp-admin by hand, and the alert built on this match had been proven to reach
# the channel. It carries a credential, which is why it was manual first.
#
# The alert is only as timely as this match, so a hand-run match defeats it:
# a new critical published on a Tuesday would wait until someone pressed the
# button. One fetch a day is well inside whatever Wordfence's limit is; two
# nine seconds apart were not.
#
# ON A SCHEDULED RUN EVERY `inputs.*` IS EMPTY. A `--feed ""` would fail, and
# a persist job gated on a bare `inputs.persist_ledger` would silently skip,
# so the scheduled match would never reach the ledger or the alert. Every
# input this file reads goes through a default below, and
# test/test-workflows.py refuses a bare input in any scheduled workflow.
#
# THIS WORKFLOW DOES NOT WRITE TO THE LEDGER AND DOES NOT PUBLISH.
# It answers three questions and stops:
#   1. Does the key work, and what is actually in the feed?
#   2. Which installed components are actually affected, at the versions we
#      actually run -- and which of those have no fix available?
#   3. What does the Pods record look like, so the matcher stays testable
#      offline?
#
# It is deliberately not step 3 of docs/VULN-INTEL-REVIEW.md in full. There is
# no `vuln-intel` source in fleet-ledger.py yet, and CLAUDE.md's checklist for
# adding a workflow puts reconciliation and a MEASURED predicate before any
# ingest. Fetching first and ingesting later is the order that checklist asks
# for.
#
# NO STEP HERE ENDS IN `|| true`. On 2026-08-25 the Nexcess probe step did:
# the token was rejected, the step printed "unauthorised", went GREEN, and the
# run died three steps later as a Python traceback. A diagnostic whose exit
# code is discarded is not a diagnostic.
#
# THE FEED IS NEVER COMMITTED. Measured 2026-08-30 it is **153,806,638 bytes**
# and 39,455 records; this repo's ledger is the one asset that cannot be
# regenerated and a 147 MB opaque blob does not belong beside it. The extracted
# fixture comes back as an artifact and a person commits it after looking.
#
# IT IS FETCHED EXACTLY ONCE, AND THAT COST THE FIRST RUN.
# Run 33313337785 on 2026-08-30 pulled the feed in `probe` and AGAIN in
# `fixture`, nine seconds apart, and Wordfence answered the second with
# `429 API key limit exceeded, try again later`. The probe had already
# succeeded; the run went red on a step that was asking for something it
# already had. So the fetch is its own step and everything after it reads the
# cached file with --feed-file. Do not add a step that fetches again.
#
# One data point, and it is worth stating precisely: it establishes that two
# full-feed requests nine seconds apart is over the limit. It does NOT
# establish the "1 per 30 minutes" figure that docs/VULN-INTEL-REVIEW.md used
# to assert, and which is struck through there for having no vendor source.

name: Vulnerability Feed Probe

on:
  schedule:
    - cron: "37 11 * * *"   # daily, 07:37 America/New_York during EDT (UTC-4)
  workflow_dispatch:
    inputs:
      feed:
        description: "production carries cvss/cwe/cve and is what severity needs. scanner is match-only."
        type: choice
        options: [production, scanner]
        default: production
      fixture_slug:
        description: "Extract this slug's records as a test fixture. Blank skips extraction."
        type: string
        default: pods
      show:
        description: "How many intersecting slugs to print."
        type: string
        default: "40"
      allow_stale:
        description: "On 429 only, reuse the cached feed rather than failing. Its age is printed above every number either way."
        type: boolean
        default: true
      persist_ledger:
        description: "Ingest this run's findings into the append-only ledger."
        type: boolean
        default: true
      publish_dashboard:
        description: "Publish. A ledger that moves while the page does not is worse than not publishing: the page looks current."
        type: boolean
        default: true
      allow_coverage_drop:
        description: "This run measured fewer sites than the last and that is expected. Both guards need it; telling one leaves the publish refusing anyway."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Not named `persist-ledger` or `publish`: this job does neither, and
  # test/test-workflows.py keys the shared-state contract on those names.
  vuln-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Inputs resolved ONCE, with the dispatch defaults, so a scheduled run
    # (where every input is empty) behaves like a default dispatch.
    env:
      FEED: ${{ inputs.feed || 'production' }}
      SHOW: ${{ inputs.show || '40' }}
      SLUG: ${{ inputs.fixture_slug || '' }}
    # ONE SCAN AT A TIME. Two full-feed requests nine seconds apart got
    # `429 API key limit exceeded` on 2026-08-30. Two runs at once are two
    # fetches, and the second one fails.
    # Its own group, not the ledger lock: the ledger lock serialises a 25-second
    # ingest and this would queue a scan behind an unrelated one. B9 in
    # docs/DO-THIS-NEXT.md; test/test-workflows.py asserts every scan job
    # carries a group of its own.
    concurrency:
      group: wordfence-feed
      queue: max
      cancel-in-progress: false
    outputs:
      stamp: ${{ steps.stamp.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp this run
        id: stamp
        # The run id the ledger keys on. Generated once here and passed
        # forward, never recomputed downstream: two stamps would be two runs.
        run: echo "value=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"

      - name: Confirm the component catalogue is committed
        # The catalogue IS the thing the feed is matched against. Without it
        # the probe still runs but reports the intersection as UNMEASURED
        # rather than zero -- which is correct but useless, so fail early and
        # say why instead.
        run: |
          test -f history/components.jsonl \
            || { echo "::error::history/components.jsonl is missing. It is the component catalogue and must not be gitignored."; exit 1; }
          python3 -c "import json,sys;n=sum(1 for _ in open('history/components.jsonl'));print('catalogue OK: %d rows' % n);sys.exit(1 if n==0 else 0)"

      # The feed is rate-limited at somewhere between 22.5 and 36.5 minutes,
      # measured 2026-08-30 across three runs: 9 seconds refused, 22.5 minutes
      # refused, 36.5 minutes allowed. So a second dispatch inside that window
      # cannot fetch at all, and run 33315975286 failed for exactly that.
      #
      # Caching it means a re-run reports on the copy it already has instead of
      # failing outright. The key rolls hourly and the restore-key lets an older
      # copy come back -- which is only safe because every command prints the
      # feed's age before any number derived from it. A cached feed with no
      # stated age would be another row in CLAUDE.md's table.
      - name: Work out the cache bucket
        id: bucket
        run: echo "value=$(date -u +%Y-%m-%d-%H)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached feed
        uses: actions/cache@v4
        with:
          path: .feed-cache
          key: wf-feed-${{ env.FEED }}-${{ steps.bucket.outputs.value }}
          restore-keys: |
            wf-feed-${{ env.FEED }}-

      - name: Confirm the key is present
        env:
          WF_KEY: ${{ secrets.WF_KEY }}
        run: |
          test -n "$WF_KEY" \
            || { echo "::error::WF_KEY is not set. Add it under Settings -> Secrets and variables -> Actions. It is never committed."; exit 1; }
          echo "key present (${#WF_KEY} characters)"

      - name: Fetch the feed (once)
        # The ONLY network call in this workflow. No `|| true`: a non-zero exit
        # here is the answer, not a nuisance. 401 and 403 are reported as
        # different problems on purpose -- 401 is Wordfence rejecting the key,
        # 403 is an edge refusing the request before the key is read.
        # Collapsing those cost five days on Nexcess.
        #
        # It also refuses to cache a body that is not the feed, because a
        # cached web page would look like a successful fetch to every step
        # after it.
        env:
          WF_KEY: ${{ secrets.WF_KEY }}
        run: |
          mkdir -p .feed-cache
          python3 scripts/fleet-vuln.py fetch \
            --feed "$FEED" \
            ${{ (github.event_name == 'schedule' || inputs.allow_stale) && '--allow-stale' || '' }} \
            --out ".feed-cache/wf-feed.json"

      - name: Probe the feed
        # Reads the cached file. Passing no --feed-file would fetch again and
        # trip the rate limit; that is what happened on 2026-08-30.
        run: |
          python3 scripts/fleet-vuln.py probe \
            --feed "$FEED" \
            --feed-file ".feed-cache/wf-feed.json" \
            --components history/components.jsonl \
            --show "$SHOW"

      - name: Match the fleet against the feed
        # Reads the cached feed. Reporting only: it writes nothing, scores no
        # severity, and touches no ledger. There is no `vuln-intel` source in
        # fleet-ledger.py yet and no severity codes, and CLAUDE.md's checklist
        # puts both of those before an ingest.
        #
        # No WF_KEY here on purpose, same as the fixture step: without it this
        # step CANNOT fetch, so the double-fetch bug cannot return.
        run: |
          mkdir -p out/reports
          python3 scripts/fleet-vuln.py match \
            --feed "$FEED" \
            --feed-file ".feed-cache/wf-feed.json" \
            --components history/components.jsonl \
            --inventory data/fleet-inventory.json \
            --report "out/reports/fleet-vuln-intel-${{ steps.stamp.outputs.value }}.json" \
            --show "$SHOW"

      - name: Upload the report for the ledger
        uses: actions/upload-artifact@v4
        with:
          name: fleet-vuln-intel-${{ steps.stamp.outputs.value }}
          path: out/reports/
          if-no-files-found: error
          retention-days: 90

      - name: Extract the fixture
        if: ${{ github.event_name != 'schedule' && inputs.fixture_slug != '' }}
        # The Pods record is the test fixture for the version comparator, and
        # the comparator is the piece that must be right. Extracting it here
        # means step 4 is developed and tested with no key on any laptop.
        #
        # `fixture` REFUSES to write an empty file. An extraction that produced
        # nothing but exited 0 would look exactly like a successful one.
        #
        # Reads the cached feed. No WF_KEY here on purpose: without it this step
        # CANNOT fetch, so the double-fetch bug cannot come back by someone
        # dropping --feed-file.
        run: |
          mkdir -p out
          python3 scripts/fleet-vuln.py fixture \
            --feed "$FEED" \
            --feed-file ".feed-cache/wf-feed.json" \
            --slug "$SLUG" \
            --out "out/wf-$SLUG-$FEED.json"

      - name: Upload the fixture
        if: ${{ github.event_name != 'schedule' && inputs.fixture_slug != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vuln-fixture-${{ env.SLUG }}-${{ env.FEED }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Ingest. Step 4 of CLAUDE.md's "adding a workflow" checklist, which the
  # gating sweep skipped for a week: it was in the suite, its data came off a
  # laptop, and nothing said so because the data looked no different.
  # ---------------------------------------------------------------------------
  persist-ledger:
    name: Ingest into the ledger
    needs: vuln-probe
    if: >-
      always()
      && (github.event_name == 'schedule' || inputs.persist_ledger)
      && needs.vuln-probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # SAME GROUP as every other ledger writer, so two sources can never write
    # observations.jsonl at once. `queue: max` because GitHub keeps only ONE
    # run pending per group by default and a newly queued run CANCELS the one
    # already waiting -- silently, with no failed run and nothing on any page.
    concurrency:
      group: fleet-ledger-write
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run's report
        uses: actions/download-artifact@v4
        with:
          name: fleet-vuln-intel-${{ needs.vuln-probe.outputs.stamp }}
          path: /tmp/ci-reports

      - name: Ingest, render and push
        env:
          # persist-ledger.sh prints the drop either way; this only decides the
          # exit code, and therefore whether publish is allowed to run. It must
          # reach BOTH guards -- telling one leaves the publish refusing anyway.
          FLEET_ALLOW_COVERAGE_DROP: ${{ inputs.allow_coverage_drop && '1' || '0' }}
        run: ./scripts/persist-ledger.sh /tmp/ci-reports "Wordfence vulnerability match"

  # ---------------------------------------------------------------------------
  # Publish. A workflow that writes to the ledger MUST also publish: until
  # 2026-08-19 only Pantheon did, and three sources moved the ledger while
  # fleet.thudstaff.com rendered older data. Nobody sees a stale page and
  # knows it is stale.
  #
  # NOTE the /vulnerabilities route this page needs is inert until someone
  # runs `wrangler deploy` from ci/cloudflare. Publishing uploads the file;
  # it does not create the route.
  # ---------------------------------------------------------------------------
  publish-dashboard:
    name: Publish dashboard
    needs: persist-ledger
    if: >-
      always()
      && (github.event_name == 'schedule' || inputs.publish_dashboard)
      && needs.persist-ledger.result == 'success'
    uses: ./.github/workflows/_publish-dashboard.yml
    secrets: inherit
    with:
      # `== true`, because on a scheduled run the input is an empty string and
      # the called workflow declares this as a boolean.
      allow_coverage_drop: ${{ inputs.allow_coverage_drop == true }}
      label: "Wordfence vulnerability match"
